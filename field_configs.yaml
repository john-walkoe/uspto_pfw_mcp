# Patent File Wrapper MCP Field Configuration
# Progressive Workflow: Minimal → User Selection → Balanced → Content Analysis
# Customize field sets by uncommenting fields you want (remove the # symbol)
#
# ⚠️ IMPORTANT: After editing this file, you MUST restart the MCP server for changes to take effect.
# In Claude Desktop: Close Claude completely and reopen it. The new field configuration will be loaded on startup.
# The search tools will then use your updated field sets.

version: "2.1"
description: "Patent File Wrapper MCP Field Configuration - Progressive workflow with no duplicate fields"

predefined_sets:
  applications_minimal:
    description: "Ultra-minimal fields for application searches (95-99% context reduction)"
    fields:
      # === MOST USED FIELDS ===
      - applicationNumberText                           # Application number (required)
      - applicationMetaData.inventionTitle              # Patent title (required)
      - applicationMetaData.inventorBag                 # All inventors (array)
      - applicationMetaData.firstApplicantName          # First applicant (often company/organization)
      - applicationMetaData.uspcSymbolText              # US Patent Classification (combined)
      - applicationMetaData.cpcClassificationBag        # Cooperative Patent Classification
      - applicationMetaData.patentNumber                # Patent number (if granted)
      - parentPatentNumber                              # Parent patent numbers (short form)
      - associatedDocuments                             # XML files metadata
      - applicationMetaData.examinerNameText            # Assigned examiner
      - applicationMetaData.groupArtUnitNumber          # Art unit number
      - applicationMetaData.filingDate                  # Original filing date
      - applicationMetaData.grantDate                   # Grant date (if granted)
      - applicationMetaData.customerNumber              # Customer number
      - applicationMetaData.applicationStatusCode       # Status code
      # - applicationMetaData.applicantBag              # All applicants (array) - BALANCED ONLY
      # - assignmentBag                                 # Assignment records - BALANCED ONLY
      # - applicationMetaData.applicationStatusDescriptionText  # Human-readable status - BALANCED ONLY

      # IMPORTANT: Keep documentBag functionality available but commented out
      # Users can uncomment this line if they need documentBag in search results
      # WARNING: Including documentBag can cause massive token usage (100,000+ characters for patents with extensive prosecution history)
      # Use PFW_get_application_documents for targeted document access instead

      # Uncomment the line below ONLY if you need prosecution documents in search results:
      # - documentBag  # WARNING: Can cause 100x token increase - use PFW_get_application_documents instead


      # === DOCKET DATA ===
      # - applicationMetaData.applicationConfirmationNumber  # Confirmation number
      # - applicationMetaData.docketNumber              # Attorney/agent docket number
      # - applicationMetaData.attorneyDocketNumber      # Alternative attorney docket field

      # === DATES ===
      # - applicationMetaData.effectiveFilingDate       # NOT the earliest priority date.
      #   Live-verified 2026-08-30: it is the 371 national-stage ENTRY date for a
      #   national-stage case and the CHILD'S OWN filing date for a continuation
      #   (app 13975827 reports 2013-08-26 while its provisional 61/694,492 was filed
      #   2012-08-29). Any AIA or prior-art cutoff built on it inverts. Use the
      #   `earliest_priority_date` / `priority_basis` the balanced tiers and
      #   PFW_get_family compute from the priority chain instead.
      # - applicationMetaData.applicationStatusDate     # When status was last updated
      # - applicationMetaData.publicationDateBag        # Publication dates
      # - applicationMetaData.earliestPublicationNumber # Publication number
      # - applicationMetaData.earliestPublicationDate   # Earliest publication date (specific)
      # - applicationMetaData.pctPublicationDate        # PCT publication date

      # === INVENTORS & APPLICANTS ===
      # - applicationMetaData.firstInventorName         # First named inventor
      # - applicationMetaData.firstInventorToFileIndicator # AIA status ("Y"/"N") - ENABLED IN BALANCED
      # - applicationMetaData.assigneeBag               # Current assignees (array)

      # === APPLICATION TYPE & ENTITY ===
      # - applicationMetaData.applicationTypeCode       # Application type code
      # - applicationMetaData.applicationTypeLabelName  # Application type description
      # - applicationMetaData.applicationTypeCategory   # Additional application categorization
      # - applicationMetaData.entityStatusData          # Entity status (large/small/micro)
      # - applicationMetaData.entityStatusData.businessEntityStatusCategory  # Entity category

      # === CLASSIFICATION ===
      # - applicationMetaData.class                     # USPC Class (first level)
      # - applicationMetaData.subclass                  # USPC Subclass (second level)
      # - applicationMetaData.ipcClassificationBag      # International Patent Classification
      # - applicationMetaData.locarnoClassificationBag  # Locarno Classification (design)

      # === FAMILY & CONTINUITY ===
      # - parentContinuityBag                           # Parent application data (full)
      # - parentContinuityBag.parentPatentNumber        # Parent patent numbers only
      # - parentContinuityBag.parentApplicationNumberText  # Parent application numbers
      # - childContinuityBag                            # Child application data (full)
      # - childContinuityBag.childApplicationNumberText # Child application numbers

      # === INTERNATIONAL & PRIORITY ===
      # - applicationMetaData.nationalStageIndicator    # Is this a national stage PCT application? (true/false)
      # - applicationMetaData.pctBag                    # PCT application data
      # - applicationMetaData.pctPublicationNumber      # PCT publication number (e.g., WO 2009/064413)
      # - applicationMetaData.internationalRegistrationNumber  # International registration number
      # - applicationMetaData.internationalRegistrationPublicationDate  # International registration pub date
      # - applicationMetaData.priorityClaimBag          # Priority claims
      # - foreignPriorityBag                            # Foreign priority data
      #   PROVENANCE (live-probed 2026-08-21, ODP search API): this field is
      #   TOP-LEVEL, not under applicationMetaData. The old
      #   `applicationMetaData.foreignPriorityBag` path is DEAD — it returns
      #   nothing rather than erroring, so uncommenting it would have silently
      #   yielded an empty bag. See api/field_constants.py USPTOFields.

      # === PUBLICATIONS & RELATED DOCS ===
      # - applicationMetaData.relatedPublicationBag     # Related publications
      # - applicationMetaData.publicationSequenceNumberBag  # Publication sequence numbers
      # - applicationMetaData.publicationCategoryBag    # Publication categories (Pre-Grant, Grant, etc.)

      # === ADVANCED DATA ===
      # - patentTermAdjustmentData                      # Patent term adjustments
      #   PROVENANCE (live-probed 2026-08-21, ODP search API): `termAdjustmentBag`
      #   is NOT an ODP field at all — the real one is `patentTermAdjustmentData`
      #   (top-level). PFW_get_term_adjustment reads it. See
      #   api/field_constants.py USPTOFields.PATENT_TERM_ADJUSTMENT_DATA.
      # - transactionBag                                # Transaction history

  applications_balanced:
