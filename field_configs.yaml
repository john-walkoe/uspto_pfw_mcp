      #   PFW_get_family compute from the priority chain instead.
      # - applicationMetaData.applicationStatusDate     # When status was last updated
      # - applicationMetaData.publicationDateBag        # Publication dates
      # - applicationMetaData.earliestPublicationNumber # Publication number
      # - applicationMetaData.earliestPublicationDate   # Earliest publication date (specific)
      # - applicationMetaData.pctPublicationDate        # PCT publication date

      # === INVENTORS & APPLICANTS ===
      # - applicationMetaData.firstInventorName         # First named inventor
      - applicationMetaData.firstInventorToFileIndicator # AIA first-inventor-to-file status.
      #   Live-probed 2026-08-30: served as the STRING "Y"/"N" on applicationMetaData
      #   (app 14257618 -> "Y"). Enabled in the balanced tiers 2026-08-30 — no tier
      #   returned AIA status before, so pre-AIA vs AIA had to be inferred from dates.
      #   NAMESAKE WARNING: parentContinuityBag[] and childContinuityBag[] entries carry
      #   their own BOOLEAN `firstInventorToFileIndicator` describing THAT related
      #   application, not this one. Do not read a continuity-bag boolean as this
      #   application's AIA status.
      # - applicationMetaData.assigneeBag               # Current assignees (array)

      # === APPLICATION TYPE & ENTITY ===
      # - applicationMetaData.applicationTypeCode       # Application type code
      # - applicationMetaData.applicationTypeLabelName  # Application type description
      # - applicationMetaData.applicationTypeCategory   # Additional application categorization
      # - applicationMetaData.entityStatusData          # Entity status (large/small/micro)
      # - applicationMetaData.entityStatusData.businessEntityStatusCategory  # Entity category

      # === CLASSIFICATION ===
