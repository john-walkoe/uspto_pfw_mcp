      # - parentContinuityBag.parentPatentNumber        # Parent patent numbers only
      - parentContinuityBag.parentApplicationNumberText  # Parent application numbers (family awareness; scalar, not the full bag)
      - parentContinuityBag.parentApplicationFilingDate  # Parent filing dates - feeds earliest_priority_date
      - parentContinuityBag.claimParentageTypeCode      # CON / CIP / DIV / PRO (PRO = provisional)
      #   Live-probed 2026-08-30: dotted parentContinuityBag subfield selection IS
      #   served (app 13975827 returned parent 61694492, filed 2012-08-29, code PRO,
      #   while its own effectiveFilingDate was 2013-08-26). These two scalars are what
      #   lets the balanced tiers report earliest_priority_date / priority_basis instead
      #   of leaving callers to misread effectiveFilingDate as the priority date.
